<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}F1 Race Results Tracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('index') }}">F1 Race Results Tracker</a>
    <nav>
      <a href="{{ url_for('drivers') }}">Drivers</a>
      <a href="{{ url_for('races') }}">Races</a>
      <a href="{{ url_for('standings') }}">Standings</a>
      <a href="{{ url_for('progression') }}">Progress chart</a>
      <a href="{{ url_for('compare') }}">Compare</a>
      <a href="{{ url_for('new_driver') }}">Register driver</a>
      <a href="{{ url_for('transaction_demo') }}">Transaction demo</a>
    </nav>
  </header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
